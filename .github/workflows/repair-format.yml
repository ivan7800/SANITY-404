name: Repair branch formatting
on:
  push:
    branches:
      - feature/webgpu-vertical-slice
permissions:
  contents: write
jobs:
  repair:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format affected source files
        run: npx prettier --write "src/experiments/webgpu-lab.ts" "src/experiments/webgpu-renderer.ts" "tests/webgpu-lab.test.mjs"
      - name: Commit only formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "src/experiments/webgpu-lab.ts" "src/experiments/webgpu-renderer.ts" "tests/webgpu-lab.test.mjs"
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "style: apply Prettier to experimental files"
            git push origin HEAD:feature/webgpu-vertical-slice
          fi
      - run: npm run format:check
