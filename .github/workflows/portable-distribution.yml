name: Build portable SANITY-404 ZIPs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm test -- --maxWorkers=1
      - run: npm run format:check
      - run: npm run audit:rooms
      - run: npx playwright install chromium
      - run: npm run package:portable:linux
      - run: node scripts/verify-portable-stage.mjs portable/release/linux
      - name: Verify extracted ZIP
        run: |
          mkdir -p "$RUNNER_TEMP/sanity404-linux-zip"
          unzip -q portable/release/SANITY-404-Linux-x64.zip -d "$RUNNER_TEMP/sanity404-linux-zip"
          node scripts/verify-portable-stage.mjs "$RUNNER_TEMP/sanity404-linux-zip"
          sha256sum portable/release/SANITY-404-Linux-x64.zip
      - name: Test extracted Linux launcher and server
        run: node scripts/test-portable-runtime.mjs "$RUNNER_TEMP/sanity404-linux-zip"
      - name: Test browser and saved state across server restart
        run: node scripts/test-portable-browser.mjs "$RUNNER_TEMP/sanity404-linux-zip"
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: SANITY-404-Linux-x64
          path: portable/release/SANITY-404-Linux-x64.zip
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm test -- --maxWorkers=1
      - run: npx playwright install chromium
      - run: npm run build:portable:assets
      - name: Compile standalone Windows server
        shell: cmd
        run: |
          pushd "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer" || exit /b 1
          for /f "usebackq delims=" %%I in (`vswhere.exe -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%I"
          popd
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          mkdir portable\bin\windows
          cl /nologo /O2 /MT /W4 /WX portable\server.c /Fe:portable\bin\windows\sanity404-server.exe ws2_32.lib shell32.lib
          if errorlevel 1 exit /b 1
      - run: node scripts/stage-portable.mjs windows
      - run: node scripts/verify-portable-stage.mjs portable/release/windows
      - name: Create and verify Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'portable/release/windows/*' -DestinationPath 'portable/release/SANITY-404-Windows-x64.zip' -CompressionLevel Optimal
          Expand-Archive 'portable/release/SANITY-404-Windows-x64.zip' -DestinationPath "$env:RUNNER_TEMP\sanity404-windows-zip"
          node scripts/verify-portable-stage.mjs "$env:RUNNER_TEMP\sanity404-windows-zip"
          Get-FileHash 'portable/release/SANITY-404-Windows-x64.zip' -Algorithm SHA256
          if ($LASTEXITCODE -ne 0) { throw 'ZIP verification failed' }
      - name: Test extracted Windows launcher and server
        shell: pwsh
        run: node scripts/test-portable-runtime.mjs "$env:RUNNER_TEMP\sanity404-windows-zip"
      - name: Test browser and saved state across server restart
        shell: pwsh
        run: node scripts/test-portable-browser.mjs "$env:RUNNER_TEMP\sanity404-windows-zip"
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: SANITY-404-Windows-x64
          path: portable/release/SANITY-404-Windows-x64.zip
          if-no-files-found: error
