name: Verify pull requests
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Use runner Chrome
        run: |
          chrome_path="$(command -v google-chrome)"
          test -x "$chrome_path"
          "$chrome_path" --version
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
      - name: Launch game
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/sanity-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sanity-vite.log
          exit 1
      - name: Browser QA of all three eras
        env:
          SANITY_TEST_URL: http://127.0.0.1:5173
          SANITY_ARTIFACT_DIR: browser-artifacts
        run: node scripts/browser-historical.mjs
      - name: Test the historical reconstruction in Chrome
        if: ${{ !cancelled() }}
        env:
          SANITY_TEST_URL: http://127.0.0.1:5173/
        run: node scripts/browser-phase21.mjs
      - name: Test the compiled web game
        if: ${{ !cancelled() }}
        env:
          SANITY_SOFTWARE: "1"
          SANITY_TEST_CORRUPT_SAVE: "1"
        run: |
          npm run build
          mkdir -p /tmp/sanity-web
          ln -s "$PWD/dist" /tmp/sanity-web/SANITY-404
          python3 -m http.server 5180 --bind 127.0.0.1 --directory /tmp/sanity-web &
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:5180/SANITY-404/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:web:production
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-browser-evidence
          path: |
            browser-artifacts/
            /tmp/sanity-vite.log
          if-no-files-found: warn
