name: Verify pull requests
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Diagnose formatting for premium files
        run: |
          npx prettier --write src/engine/input.ts src/render/materials.ts
          git diff -- src/engine/input.ts src/render/materials.ts
      - run: npm run format:check
      - run: npm test
      - run: npm run build
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Use runner Chrome
        run: |
          chrome_path="$(command -v google-chrome)"
          test -x "$chrome_path"
          "$chrome_path" --version
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
      - name: Launch game
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/sanity-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sanity-vite.log
          exit 1
      - name: Browser QA of all three eras
        env:
          SANITY_TEST_URL: http://127.0.0.1:5173
          SANITY_ARTIFACT_DIR: browser-artifacts
        run: node scripts/browser-historical.mjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-browser-evidence
          path: |
            browser-artifacts/
            /tmp/sanity-vite.log
          if-no-files-found: warn
