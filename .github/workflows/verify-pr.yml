name: Verify pull requests
on:
  pull_request:
    branches: [main]
  push:
    branches: ["audit/qa-integral-fase4"]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format audit branch
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: |
          npx prettier --write src tests scripts index.html package.json tsconfig.json vite.config.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests scripts index.html package.json tsconfig.json vite.config.ts
            git commit -m "style: format audit browser tests"
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          fi
      - run: npm run format:check
      - run: npm test
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Launch game
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/sanity-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sanity-vite.log
          exit 1
      - name: Browser QA of all three eras
        env:
          SANITY_TEST_URL: http://127.0.0.1:5173
        run: node scripts/browser-historical.mjs
