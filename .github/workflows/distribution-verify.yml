name: Verify distribution packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run format:check
      - run: npm run audit:rooms
      - run: npm run build:web
      - run: npm run build:desktop:assets
      - run: npm run verify:distribution

  windows:
    needs: web
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Require a private repository for the installer artifact
        if: ${{ !github.event.repository.private }}
        shell: pwsh
        run: throw 'The NSIS artifact requires a private repository; run this workflow in a private repository.'
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npm test
      - run: npm run build:web
      - run: npm run build:desktop:assets
      - run: npm run verify:distribution
      - name: Verify Electron resources and persistence on Windows runner
        run: npm run test:desktop:smoke && npm run test:desktop:save
      - run: npm --prefix desktop run package:windows
      - run: npm run verify:windows-package
      - name: Verify NSIS installer and write SHA-256
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem 'desktop/release/*.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count)" }
          $installer = $installers[0]
          if ($installer.Length -le 0) { throw "Empty installer: $($installer.Name)" }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Path 'desktop/release/SHA256SUMS.txt' -Encoding ascii
          $manifest = [ordered]@{
            commit = $env:GITHUB_SHA
            runnerOs = $env:RUNNER_OS
            runnerArch = $env:RUNNER_ARCH
            runnerImageVersion = $env:ImageVersion
            node = (node --version)
            npm = (npm --version)
            electron = (Get-Content 'desktop/package.json' -Raw | ConvertFrom-Json).devDependencies.electron
            electronBuilder = (Get-Content 'desktop/package.json' -Raw | ConvertFrom-Json).devDependencies.'electron-builder'
            rootLockSha256 = (Get-FileHash 'package-lock.json' -Algorithm SHA256).Hash.ToLowerInvariant()
            desktopLockSha256 = (Get-FileHash 'desktop/package-lock.json' -Algorithm SHA256).Hash.ToLowerInvariant()
            asarSha256 = (Get-FileHash 'desktop/release/win-unpacked/resources/app.asar' -Algorithm SHA256).Hash.ToLowerInvariant()
            installer = $installer.Name
            installerSha256 = $hash
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Path 'desktop/release/build-manifest.json' -Encoding utf8
          Write-Host "$($installer.Name): $($installer.Length) bytes; SHA-256 $hash"
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: sanity-404-windows-nsis-x64
          path: |
            desktop/release/*.exe
            desktop/release/SHA256SUMS.txt
            desktop/release/build-manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve Windows Electron QA evidence
        if: ${{ always() && github.event.repository.private }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: sanity-404-windows-qa
          path: |
            docs/capturas/fase34/electron-native/
            docs/capturas/fase34/electron-save-native/
          if-no-files-found: warn
          retention-days: 14
