<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 680" role="img" aria-labelledby="title desc">
  <title id="title">Mansión Veyr 1927: planta baja y galería superior</title>
  <desc id="desc">Plano técnico a escala esquemática de 35 píxeles por metro. La escalera ocupa el lado este y desemboca en la galería norte, que conecta las dos salas superiores.</desc>
